name: Build and publish Raid Buff Off
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'RaidBuffOff/**'
      - '.github/scripts/**'
      - '.github/workflows/build.yml'
      - 'LICENSE'
permissions:
  contents: read
concurrency:
  group: raid-buff-off-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate packaging scripts
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem -LiteralPath .github/scripts -Filter '*.ps1') {
            $parseErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Test removal policy
        shell: pwsh
        run: |
          dotnet run --project RaidBuffOff/tests/RaidBuffOff.Core.Tests.csproj -c Release -p:NuGetAudit=false -- --catalog-output "$env:RUNNER_TEMP/raid-catalog.json"
          if ($LASTEXITCODE -ne 0) { throw 'Buff removal policy tests failed.' }
      - name: Validate catalogue against Global game data
        shell: pwsh
        run: |
          & ./.github/scripts/Validate-Catalog.ps1 -CatalogPath "$env:RUNNER_TEMP/raid-catalog.json"
      - name: Download Global Dalamud libraries
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'dalamud'
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/stg/latest.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $dll = Get-ChildItem -LiteralPath $directory -Filter Dalamud.dll -Recurse -File | Select-Object -First 1
          if (-not $dll) { throw 'Dalamud.dll is missing.' }
          if ([Reflection.AssemblyName]::GetAssemblyName($dll.FullName).Version.Major -ne 15) {
            throw 'This plugin requires Global Dalamud API 15.'
          }
          "DALAMUD_LIB_PATH=$($dll.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build plugin
        shell: pwsh
        run: |
          dotnet build RaidBuffOff/RaidBuffOff.csproj -c Release "-p:DalamudLibPath=$env:DALAMUD_LIB_PATH/" -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { throw 'Plugin build failed.' }
      - name: Package and verify testing plugin
        shell: pwsh
        run: |
          & ./.github/scripts/Package.ps1 -SourceCheckout $env:GITHUB_WORKSPACE -OutputDirectory "$env:RUNNER_TEMP/buff-off-feed" -DalamudDirectory $env:DALAMUD_LIB_PATH
      - uses: actions/upload-artifact@v4
        with:
          name: RaidBuffOffRepository
          path: ${{ runner.temp }}/buff-off-feed/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: RaidBuffOffRepository
          path: ${{ runner.temp }}/buff-off-feed/
      - name: Publish download files
        shell: pwsh
        run: |
          $publisher = Join-Path $env:RUNNER_TEMP 'Publish-RaidBuffOff.ps1'
          Copy-Item -LiteralPath .github/scripts/Publish.ps1 -Destination $publisher
          & $publisher -SourceCheckout $env:GITHUB_WORKSPACE -FeedDirectory "$env:RUNNER_TEMP/buff-off-feed"
